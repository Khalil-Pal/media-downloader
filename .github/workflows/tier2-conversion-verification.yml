name: Tier 2 conversion verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/tier2-conversion-verification.yml"
      - "Dockerfile"
      - "requirements.txt"
      - "services/converter.py"
      - "handlers/convert_handler.py"
      - "tests/test_converter_tier2.py"
      - "tests/tier2_docker_verify.py"
      - "en.json"
      - "ar.json"
      - "ru.json"
  push:
    branches:
      - main
      - converter
      - payment
      - "codex/tier2-verification-*"
    paths:
      - ".dockerignore"
      - ".github/workflows/tier2-conversion-verification.yml"
      - "Dockerfile"
      - "requirements.txt"
      - "services/converter.py"
      - "handlers/convert_handler.py"
      - "tests/test_converter_tier2.py"
      - "tests/tier2_docker_verify.py"
      - "en.json"
      - "ar.json"
      - "ru.json"

permissions:
  contents: read

env:
  TIER1_BASELINE_REF: ed3e7ead0937827c5d9b62194afb2d97207a9643

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Docker environment
        shell: bash
        run: |
          set -o pipefail
          echo "COMMAND: docker version"
          docker version
          echo "EXIT CODE: $?"

      - name: Prepare the pre-Tier-2 baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "COMMAND: git worktree add --detach /tmp/sandy-tier1 ${TIER1_BASELINE_REF}"
          git worktree add --detach /tmp/sandy-tier1 "${TIER1_BASELINE_REF}"
          cp .dockerignore /tmp/sandy-tier1/.dockerignore
          echo "BASELINE COMMIT: $(git -C /tmp/sandy-tier1 rev-parse HEAD)"
          echo "EXIT CODE: 0"

      - name: Build Tier 1 baseline image
        shell: bash
        run: |
          set -o pipefail
          echo "COMMAND: docker build --progress=plain -t sandy-tier1:ci /tmp/sandy-tier1"
          docker build --progress=plain -t sandy-tier1:ci /tmp/sandy-tier1 2>&1 | tee tier1-build.log
          status=${PIPESTATUS[0]}
          echo "EXIT CODE: ${status}"
          exit "${status}"

      - name: Build Tier 2 image
        shell: bash
        run: |
          set -o pipefail
          echo "COMMAND: docker build --progress=plain -t sandy-tier2:ci ."
          docker build --progress=plain -t sandy-tier2:ci . 2>&1 | tee tier2-build.log
          status=${PIPESTATUS[0]}
          echo "EXIT CODE: ${status}"
          exit "${status}"

      - name: Report compressed and uncompressed image sizes
        shell: bash
        run: |
          set -euo pipefail
          echo "COMMAND: docker image inspect sandy-tier1:ci sandy-tier2:ci"
          tier1_uncompressed=$(docker image inspect sandy-tier1:ci --format '{{.Size}}')
          tier2_uncompressed=$(docker image inspect sandy-tier2:ci --format '{{.Size}}')

          echo "COMMAND: docker save <image> | gzip -9"
          docker save sandy-tier1:ci | gzip -9 > sandy-tier1.tar.gz
          docker save sandy-tier2:ci | gzip -9 > sandy-tier2.tar.gz
          tier1_compressed=$(stat -c%s sandy-tier1.tar.gz)
          tier2_compressed=$(stat -c%s sandy-tier2.tar.gz)

          {
            echo "tier1_uncompressed_bytes=${tier1_uncompressed}"
            echo "tier2_uncompressed_bytes=${tier2_uncompressed}"
            echo "uncompressed_delta_bytes=$((tier2_uncompressed - tier1_uncompressed))"
            echo "tier1_compressed_archive_bytes=${tier1_compressed}"
            echo "tier2_compressed_archive_bytes=${tier2_compressed}"
            echo "compressed_delta_bytes=$((tier2_compressed - tier1_compressed))"
            echo "EXIT CODE: 0"
          } | tee tier2-size-report.txt

      - name: Run the full unit suite inside the Tier 2 image
        shell: bash
        run: |
          set -o pipefail
          echo "COMMAND: docker run sandy-tier2:ci python -m unittest discover -s tests -v"
          docker run --rm \
            -e BOT_TOKEN=123456:test-token \
            -e PYTHON_DOTENV_DISABLED=1 \
            -e DOWNLOAD_PATH=/tmp/sandy-tier2-unit-tests \
            -v "$PWD/tests:/app/tests:ro" \
            sandy-tier2:ci \
            python -m unittest discover -s tests -v 2>&1 | tee tier2-unit-tests.log
          status=${PIPESTATUS[0]}
          echo "EXIT CODE: ${status}"
          exit "${status}"

      - name: Run every Tier 2 path inside the built image
        shell: bash
        run: |
          set -o pipefail
          echo "COMMAND: docker run sandy-tier2:ci python /app/tier2_docker_verify.py"
          docker run --rm \
            -e BOT_TOKEN=123456:test-token \
            -e PYTHON_DOTENV_DISABLED=1 \
            -e TIER2_VERIFY=1 \
            -e DOWNLOAD_PATH=/tmp/sandy-tier2-verification \
            -e MAX_CONCURRENT_CONVERSIONS=4 \
            -v "$PWD/tests/tier2_docker_verify.py:/app/tier2_docker_verify.py:ro" \
            sandy-tier2:ci \
            python /app/tier2_docker_verify.py 2>&1 | tee tier2-container-tests.log
          status=${PIPESTATUS[0]}
          echo "EXIT CODE: ${status}"
          exit "${status}"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-conversion-evidence
          path: |
            tier1-build.log
            tier2-build.log
            tier2-size-report.txt
            tier2-unit-tests.log
            tier2-container-tests.log
          if-no-files-found: ignore
